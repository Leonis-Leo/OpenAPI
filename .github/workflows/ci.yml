name: CI

on:
  push:
    branches: [ main, feature_dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: openapi
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置以下三个 secret：
      # APIFOX_ACCESS_TOKEN：Apifox 项目设置 -> 高级设置 -> API 访问令牌
      # APIFOX_TEST_SUITE_ID：Apifox 场景用例 ID（OpenAPI 项目 8662244 当前为 8584503）
      # APIFOX_ENV_ID：Apifox 环境 ID（开发环境为 47907739）
      APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
      APIFOX_TEST_SUITE_ID: ${{ secrets.APIFOX_TEST_SUITE_ID }}
      APIFOX_ENV_ID: ${{ secrets.APIFOX_ENV_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp package -DskipTests

      - name: Initialize database
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends default-mysql-client
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -p123456 -e 'SELECT 1' 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -p123456 < db/init.sql

      - name: Start backend and export OpenAPI spec
        run: |
          java -jar openapi-backend/target/openapi-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8101/v3/api-docs -o openapi.json; then
              echo "OpenAPI spec exported"
              break
            fi
            sleep 2
          done
          test -s openapi.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          if-no-files-found: error

      - name: Run Apifox automated tests
        if: env.APIFOX_ACCESS_TOKEN != '' && env.APIFOX_TEST_SUITE_ID != ''
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_TEST_SUITE_ID: ${{ secrets.APIFOX_TEST_SUITE_ID }}
          APIFOX_ENV_ID: ${{ secrets.APIFOX_ENV_ID }}
        run: |
          npm install -g apifox-cli@latest
          apifox run --access-token "$APIFOX_ACCESS_TOKEN" -t "$APIFOX_TEST_SUITE_ID" \
            -e "$APIFOX_ENV_ID" -n 1 -r cli,json

      - name: Upload Apifox test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apifox-reports
          path: apifox-reports/
          if-no-files-found: warn
