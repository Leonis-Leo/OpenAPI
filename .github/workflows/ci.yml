name: CI

on:
  push:
    branches: [ main, feature_dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置：
      # APIFOX_CI_URL：Apifox 自动化测试 -> 持续集成 里生成的带 token 的运行命令 URL
      APIFOX_CI_URL: ${{ secrets.APIFOX_CI_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp package -DskipTests

      - name: Start backend and export OpenAPI spec
        run: |
          java -jar openapi-backend/target/openapi-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8101/v3/api-docs -o openapi.json; then
              echo "OpenAPI spec exported"
              break
            fi
            sleep 2
          done
          test -s openapi.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          if-no-files-found: error

      - name: Run Apifox automated tests
        if: env.APIFOX_CI_URL != ''
        env:
          APIFOX_CI_URL: ${{ secrets.APIFOX_CI_URL }}
        run: |
          npm install -g apifox-cli
          apifox run "$APIFOX_CI_URL" -r cli,json

      - name: Upload Apifox test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apifox-reports
          path: apifox-reports/
          if-no-files-found: warn
