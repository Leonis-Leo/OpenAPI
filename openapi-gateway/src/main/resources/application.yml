server:
  port: 8080

spring:
  application:
    name: openapi-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${OPENAPI_REDIS_HOST:localhost}
      port: ${OPENAPI_REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: openapi-api-route
          # 路由到数据面服务（openapi-api :8102）；多实例时改为 lb://openapi-api（配合 Nacos）
          uri: ${OPENAPI_API_URI:http://localhost:8102}
          predicates:
            - Path=/api/**

openapi:
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  rate-limit:
    enabled: true
    key-prefix: "openapi:ratelimit:"
    config-prefix: "openapi:ratelimit:config:"

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
