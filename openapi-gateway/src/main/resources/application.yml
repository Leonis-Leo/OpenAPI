server:
  port: 8080

spring:
  application:
    name: openapi-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: openapi-api-route
          # 骨架阶段使用静态地址，后续可接入 Nacos 后改为 lb://openapi-backend
          uri: http://localhost:8101
          predicates:
            - Path=/api/**

openapi:
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  rate-limit:
    enabled: true
    # 令牌桶容量（桶内最多令牌数）
    capacity: 20
    # 每秒补充令牌数
    refill-rate: 5
    key-prefix: "openapi:ratelimit:"
