server:
  port: 8080

spring:
  application:
    name: openapi-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: openapi-api-route
          # 多实例部署时改为 lb://openapi-backend（配合 Nacos 服务发现）
          uri: ${OPENAPI_BACKEND_URI:http://localhost:8101}
          predicates:
            - Path=/api/**

openapi:
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  rate-limit:
    enabled: true
    key-prefix: "openapi:ratelimit:"
    config-prefix: "openapi:ratelimit:config:"
