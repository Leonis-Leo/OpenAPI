server:
  port: 8101

spring:
  application:
    name: openapi-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/openapi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${OPENAPI_DB_USERNAME:root}
    password: ${OPENAPI_DB_PASSWORD:123456}
    hikari:
      # 显式配置连接池，避免机器休眠/时钟跳变后借用陈旧连接导致请求挂起
      maximum-pool-size: ${OPENAPI_DB_POOL_MAX:20}
      minimum-idle: ${OPENAPI_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${OPENAPI_DB_CONN_TIMEOUT_MS:10000}
      validation-timeout: ${OPENAPI_DB_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${OPENAPI_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${OPENAPI_DB_KEEPALIVE_MS:300000}
  data:
    redis:
      host: ${OPENAPI_REDIS_HOST:localhost}
      port: ${OPENAPI_REDIS_PORT:6379}
      database: 0
  rabbitmq:
    host: ${OPENAPI_RABBITMQ_HOST:localhost}
    port: ${OPENAPI_RABBITMQ_PORT:5672}
    username: ${OPENAPI_RABBITMQ_USERNAME:guest}
    password: ${OPENAPI_RABBITMQ_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

openapi:
  # 生产模式开关：true 时若检测到默认凭据将拒绝启动
  production-mode: ${OPENAPI_PRODUCTION_MODE:false}
  snowflake:
    # 雪花 ID 工作节点 / 数据中心（0~31），多实例部署时每个实例分配唯一值
    worker-id: ${OPENAPI_SNOWFLAKE_WORKER_ID:0}
    datacenter-id: ${OPENAPI_SNOWFLAKE_DATACENTER_ID:0}
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  jwt:
    # JWT 签名密钥（HS256 要求至少 32 字节）
    secret: ${OPENAPI_JWT_SECRET:openapi-platform-jwt-secret-key-0123456789abcdef0123456789abcdef}
    # token 有效期（毫秒），默认 24 小时
    expire-millis: ${OPENAPI_JWT_EXPIRE_MILLIS:86400000}
  cookie:
    # Local HTTP keeps this false; production should set OPENAPI_COOKIE_SECURE=true.
    secure: ${OPENAPI_COOKIE_SECURE:false}
  log:
    # invoke_log 明细日志保留天数（聚合统计表永久保留）
    retention-days: ${OPENAPI_LOG_RETENTION_DAYS:30}
    # 清理任务 cron（默认每天凌晨 3 点）
    cleanup-cron: ${OPENAPI_LOG_CLEANUP_CRON:0 0 3 * * ?}
