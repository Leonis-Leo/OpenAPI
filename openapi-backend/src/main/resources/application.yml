server:
  port: 8101

spring:
  application:
    name: openapi-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/openapi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

openapi:
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  jwt:
    # JWT 签名密钥（HS256 要求至少 32 字节）
    secret: openapi-platform-jwt-secret-key-0123456789abcdef0123456789abcdef
    # token 有效期（毫秒），默认 24 小时
    expire-millis: 86400000
