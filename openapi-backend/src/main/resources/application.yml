server:
  port: 8101

spring:
  application:
    name: openapi-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/openapi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${OPENAPI_DB_USERNAME:root}
    password: ${OPENAPI_DB_PASSWORD:123456}
  data:
    redis:
      host: ${OPENAPI_REDIS_HOST:localhost}
      port: ${OPENAPI_REDIS_PORT:6379}
      database: 0
  rabbitmq:
    host: ${OPENAPI_RABBITMQ_HOST:localhost}
    port: ${OPENAPI_RABBITMQ_PORT:5672}
    username: ${OPENAPI_RABBITMQ_USERNAME:guest}
    password: ${OPENAPI_RABBITMQ_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

openapi:
  sign:
    # 允许的最大请求时间偏差（毫秒）
    max-clock-skew-millis: 300000
  jwt:
    # JWT 签名密钥（HS256 要求至少 32 字节）
    secret: ${OPENAPI_JWT_SECRET:openapi-platform-jwt-secret-key-0123456789abcdef0123456789abcdef}
    # token 有效期（毫秒），默认 24 小时
    expire-millis: ${OPENAPI_JWT_EXPIRE_MILLIS:86400000}
  cookie:
    # Local HTTP keeps this false; production should set OPENAPI_COOKIE_SECURE=true.
    secure: ${OPENAPI_COOKIE_SECURE:false}
